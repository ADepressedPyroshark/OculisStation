author: "Absolucy"
delete-after: True
changes:
  - qol: "Meteor shield satellites can now be shrunk down into tiny capsules, and deployed from said capsules."
  - balance: "The meteor shield crate now contains 5 shield sat capsules."
  - qol: "Meteors now drop debris when zapped by meteor defense sats."
  - qol: "Examining meteor defense sats now also shows how many meteors have been zapped overall by all sats."
  - balance: "Slightly boosted the range of meteor defense satellite from 14 to 16 tiles."
  - qol: "You now only need engineering access to order meteor satellites, not command access."